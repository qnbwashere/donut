<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d0d0d">
  <title>RepForge — Workout Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>

    <!-- Rest timer banner (shown between sets) -->
    <div id="rest-banner" class="rest-banner hidden">
      <div class="rest-progress" id="rest-progress"></div>
      <div class="rest-content">
        <span class="rest-label">Rest</span>
        <span class="rest-time" id="rest-time">1:30</span>
        <button class="rest-btn" id="rest-minus">-15s</button>
        <button class="rest-btn" id="rest-plus">+15s</button>
        <button class="rest-btn rest-skip" id="rest-skip">Skip</button>
      </div>
    </div>

    <!-- Resume-workout pill (shown when a workout is running but user navigates away) -->
    <button id="resume-pill" class="resume-pill hidden">
      <span class="pulse-dot"></span>
      <span id="resume-text">Workout in progress</span>
      <span class="resume-arrow">Resume ›</span>
    </button>

    <nav id="tabbar" class="tabbar">
      <button class="tab" data-tab="home"><span class="tab-icon">⌂</span>Home</button>
      <button class="tab" data-tab="routines"><span class="tab-icon">▤</span>Routines</button>
      <button class="tab tab-start" data-tab="start"><span class="start-circle">+</span></button>
      <button class="tab" data-tab="exercises"><span class="tab-icon">≡</span>Exercises</button>
      <button class="tab" data-tab="profile"><span class="tab-icon">◔</span>Profile</button>
    </nav>

    <div id="modal-root"></div>
    <div id="toast-root"></div>
  </div>

  <script src="exercises.js"></script>
  <script src="app.js"></script>
</body>
</html>
