<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0d">
  <title>RepForge — Workout Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RepForge">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="icon-192.png">
</head>
<body>
  <div id="app">
    <main id="view" class="view"></main>

    <!-- Rest timer banner (shown between sets) -->
    <div id="rest-banner" class="rest-banner hidden">
      <div class="rest-progress" id="rest-progress"></div>
      <div class="rest-content">
        <span class="rest-label">Rest</span>
        <span class="rest-time" id="rest-time">1:30</span>
        <button class="rest-btn" id="rest-minus">-15s</button>
        <button class="rest-btn" id="rest-plus">+15s</button>
        <button class="rest-btn" id="rest-clock" title="Start a real timer in your phone's Clock app">⏰</button>
        <button class="rest-btn rest-skip" id="rest-skip">Skip</button>
      </div>
    </div>

    <!-- Resume-workout pill (shown when a workout is running but user navigates away) -->
    <button id="resume-pill" class="resume-pill hidden">
      <span class="pulse-dot"></span>
      <span id="resume-text">Workout in progress</span>
      <span class="resume-arrow">Resume ›</span>
    </button>

    <nav id="tabbar" class="tabbar">
      <button class="tab" data-tab="home"><span class="tab-icon">⌂</span>Home</button>
      <button class="tab" data-tab="routines"><span class="tab-icon">▤</span>Routines</button>
      <button class="tab tab-start" data-tab="start"><span class="start-circle">+</span></button>
      <button class="tab" data-tab="exercises"><span class="tab-icon">≡</span>Exercises</button>
      <button class="tab" data-tab="profile"><span class="tab-icon">◔</span>Profile</button>
    </nav>

    <div id="modal-root"></div>
    <div id="toast-root"></div>
  </div>

  <script src="exercises.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // When a new deploy's service worker takes over, reload once so updates
      // appear on the first reopen instead of one visit behind. All app state
      // lives in localStorage (including active workouts and the rest timer),
      // so the reload is lossless. Skip the reload on the very first install.
      const hadController = !!navigator.serviceWorker.controller;
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded || !hadController) return;
        reloaded = true;
        location.reload();
      });
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
